services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      ML_SERVICE_URL: http://ml:8001
      BACKEND_CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app

  ml:
    build: ./ml
    ports:
      - "8001:8001"
    volumes:
      - ./ml:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
