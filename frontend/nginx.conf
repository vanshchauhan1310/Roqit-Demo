# Production nginx config: static SPA + API reverse proxy.
# All backend access goes through /api on the same origin, so the app works
# identically on any host/port without CORS or hardcoded hostnames.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API proxy — overrides any absolute URL the bundle was built with
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LNS / optimization calls can be slow
        proxy_send_timeout 120s;
    }

    # SPA fallback — client-side routes resolve to index.html
    # index.html is NEVER cached: it carries the hashed asset URLs, so a stale
    # cached copy pointing at an old bundle is the classic "white screen after
    # deploy". Content-hashed assets underneath it may be cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed — cache hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}